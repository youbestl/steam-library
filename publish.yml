name: Sync Steam library and deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync configured libraries
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: python scripts/sync_library.py
      - name: Prepare public files
        run: |
          mkdir -p public/data
          cp index.html app.js style.css public/
          cp index.html public/account.html
          cp data/library.json public/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
